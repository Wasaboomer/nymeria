<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c24">
<title>Nymeria Modular Character Prototype 0.1</title>
<link rel="stylesheet" href="styles.css">
<script src="items.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="app">
<header><div class="brand">NYMERIA<span>LE CRONACHE DEL VESPRO</span></div><span class="edition">SLICE / 01</span></header>
<section class="identity"><div><span class="eyebrow">IL TUO PERSONAGGIO</span><h1>Iria del Vespro</h1><p>Hayon <span>·</span> Custode delle soglie <span>·</span> Liv. 1</p></div><span class="level" aria-label="Livello 1">01</span></section>
<section class="stage" aria-label="Personaggio modulare">
<div class="stage-heading"><span>ATELIER DELLE SOGLIE</span><span class="live">IDLE</span></div>
<div class="halo"></div><div class="floor"></div>
<nav class="equipment left" aria-label="Slot sinistri"><button data-category="torso" aria-label="Corazza">♜<small>01</small></button><button data-category="legs" aria-label="Gambe">⋈<small>02</small></button><button data-category="boots" aria-label="Stivali">⌁<small>03</small></button></nav>
<svg id="character" viewBox="0 0 300 440" role="img" aria-label="Iria, personaggio fantasy adulto con equipaggiamento modulare">
<defs>
<linearGradient id="skin" x2="1" y2="1"><stop stop-color="#ddb69d"/><stop offset=".5" stop-color="#b98270"/><stop offset="1" stop-color="#76564f"/></linearGradient>
<linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ced4c6"/><stop offset=".3" stop-color="#758e8d"/><stop offset=".6" stop-color="#344b55"/><stop offset="1" stop-color="#132a35"/></linearGradient>
<linearGradient id="cloth" x2="1" y2="1"><stop stop-color="#435c62"/><stop offset="1" stop-color="#182731"/></linearGradient>
<linearGradient id="blade" x2="1" y2="0"><stop stop-color="#4d727e"/><stop offset=".5" stop-color="#e8e8d1"/><stop offset=".54" stop-color="#a0c2c2"/><stop offset="1" stop-color="#486473"/></linearGradient>
<linearGradient id="hairShade" x2="1" y2="1"><stop stop-color="white" stop-opacity=".2"/><stop offset="1" stop-color="#050f18" stop-opacity=".5"/></linearGradient>
</defs><g id="rig"></g>
</svg>
<div class="stage-caption"><span>HAYON / VESPRO</span><span>11 LAYER INDIPENDENTI</span></div>
</section>
<section class="stats" aria-label="Statistiche"><div class="power"><span>POTERE</span><strong id="power">—</strong></div><dl id="stats"></dl></section>
<section class="customizer" aria-label="Personalizzazione"><div class="section-title"><h2>Forgiato da te</h2><span id="selection-label">Aspetto</span></div><nav id="categories" aria-label="Categorie"></nav><div id="options"></div></section>
<footer><p>Nymeria Modular Character Prototype 0.1</p><span>Asset SVG esplorativi · sistema modulare</span></footer>
</main>
<div class="actions"><button id="random">↻ <span>Casuale</span></button><button id="save">Salva aspetto <span>→</span></button></div><div id="notice" role="status" aria-live="polite"></div>
</body></html>
