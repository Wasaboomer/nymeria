name: Character Rig admission checks
on:
  push:
    branches: [character-modular-poc]
  pull_request:
    paths:
      - 'tools/validate-character-*'
      - 'tests/character-*'
      - '.github/workflows/character-asset-gate.yml'
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: node tests/character-asset-admission.cjs
      - run: python tests/character-pixel-admission.py
